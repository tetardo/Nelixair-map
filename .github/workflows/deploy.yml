name: Build données + déploiement Pages

# Reconstruit les tuiles depuis les sources officielles puis publie sur GitHub Pages.
# Hebdomadaire : récupère automatiquement le nouveau cycle CIFP (28 jours).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 4"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tippecanoe
      - name: Fetch + build
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: scripts/build.sh
      - name: Résumé
        run: cat build/meta.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
