name: Build données + déploiement Pages

# Reconstruit les tuiles depuis les sources officielles puis publie sur GitHub Pages.
# Hebdomadaire : récupère automatiquement le nouveau cycle CIFP (28 jours).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 4"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tippecanoe
      - name: Fetch + build
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: scripts/build.sh
      - name: Résumé
        run: cat build/meta.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Front Vue : typage + build Vite dans dist/ (les données web/data y sont copiées)
      - name: Build du front
        run: |
          npm ci
          npm run build
      # Captures d'écran sur les données réelles (affichées par le README) ; un échec ne bloque pas le déploiement.
      - name: Captures d'écran
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
