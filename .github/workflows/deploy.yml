name: Build données + déploiement Pages

# Reconstruit les tuiles depuis les sources officielles puis publie sur GitHub Pages.
# Hebdomadaire : récupère automatiquement le nouveau cycle CIFP (28 jours).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 4"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tippecanoe
      # Plans au sol OSM : un terrain téléchargé il y a moins de 6 jours est repris du cache
      # (~1 min par terrain sinon). Le passage hebdomadaire du jeudi les rafraîchit tous.
      - name: Cache des plans au sol OSM
        uses: actions/cache@v4
        with:
          path: data/raw/ground
          key: ground-osm-${{ github.run_id }}
          restore-keys: ground-osm-
      - name: Fetch + build
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
          GROUND_MAX_AGE_DAYS: ${{ github.event_name == 'schedule' && '0' || '6' }}
        run: scripts/build.sh
      - name: Résumé
        run: cat build/meta.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Front Vue : typage + build Vite dans dist/ (les données web/data y sont copiées)
      - name: Build du front
        run: |
          npm ci
          npm run build
      # Captures d'écran sur les données réelles (affichées par le README) ; un échec ne bloque pas le déploiement.
      # ~10 min : refaites quand l'interface ou le script de captures change, au passage hebdomadaire ou au lancement manuel ;
      # sinon on reprend les dernières (clé = empreinte de web/src et du script).
      - name: Dernières captures d'écran
        id: shots
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: dist/screenshots
          key: screenshots-${{ hashFiles('web/src/**', 'scripts/screenshots.mjs') }}
          restore-keys: screenshots-
      - name: Captures d'écran
        id: newshots
        if: github.event_name != 'push' || steps.shots.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs
      - name: Mémoriser les captures
        if: steps.newshots.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dist/screenshots
          key: screenshots-${{ hashFiles('web/src/**', 'scripts/screenshots.mjs') }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # ~136 Mo de tuiles : la synchro Pages dépasse parfois 10 min, et deploy-pages plafonne
      # son délai à 10 min quel que soit « timeout ». Une 2e tentative passe en général.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
