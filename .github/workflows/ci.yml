name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests unitaires du pipeline
        run: python -m unittest discover -s pipeline/tests -v
      - name: Fixtures à jour
        run: |
          python -I pipeline/tests/make_fixtures.py
          git diff --exit-code pipeline/tests/fixtures
      - name: Relais météo sur fixtures
        run: |
          python pipeline/wx.py --out /tmp/wx --metars pipeline/tests/fixtures/wx_metars.csv --tafs pipeline/tests/fixtures/wx_tafs.xml \
            --airsigmets pipeline/tests/fixtures/wx_airsigmets.xml --isigmets pipeline/tests/fixtures/wx_isigmets.json --pireps pipeline/tests/fixtures/wx_pireps.csv
          test -s /tmp/wx/metars.json
          test -s /tmp/wx/hazards.geojson
      - uses: ./.github/actions/tippecanoe
      - name: Build de bout en bout sur fixtures (PMTiles compris)
        env:
          SKIP_FETCH: "1"
          CIFP: pipeline/tests/fixtures/FAACIFP18.sample
          OPENAIP: pipeline/tests/fixtures/openaip_navaids.json
          DTPP: pipeline/tests/fixtures/dtpp.xml
          GROUND_RAW: pipeline/tests/fixtures/ground
        run: |
          scripts/build.sh
          test -s web/data/nav.pmtiles
          test -s web/data/airspaces.pmtiles
          test -s web/data/mora.geojson
          test -s web/data/apt/KA.json
          test -s web/data/ground.pmtiles
          test -s web/data/ground-index.json
          head -c 7 web/data/nav.pmtiles | grep -q PMTiles
      # Plan au sol réel des terrains pilotes : informatif (Overpass peut être saturé), ne bloque pas la CI
      - name: Qualité OSM des terrains pilotes (Overpass)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 pipeline/ground.py fetch --raw /tmp/ground-raw
          python3 pipeline/ground.py build --raw /tmp/ground-raw --out /tmp/ground-out
          python3 -c "import json; d=json.load(open('/tmp/ground-out/ground-index.json'))['airports']; [print(k, v['osm'], v['counts'], 'taxiways:', len(v['taxiways'])) for k, v in d.items()]" | tee -a "$GITHUB_STEP_SUMMARY"
      # SimBrief : le navigateur peut-il lire l'API directement (en-tête CORS) ? Informatif.
      - name: SimBrief CORS
        continue-on-error: true
        timeout-minutes: 2
        run: |
          curl -s -o /dev/null -D - -H "Origin: https://tetardo.github.io" \
            "https://www.simbrief.com/api/xml.fetcher.php?username=nelixair_ci_probe&json=1" | grep -iE "^HTTP|access-control" | tee -a "$GITHUB_STEP_SUMMARY"
      # eAIP SIA réel : vérifie la lecture des pages AD 2 du cycle en cours (informatif, le SIA peut être indisponible)
      - name: eAIP SIA réel (terrains pilotes)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 pipeline/eaip.py fetch --raw /tmp/eaip-raw
          python3 pipeline/eaip.py build --raw /tmp/eaip-raw --out /tmp/eaip-out
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          sys.path.insert(0, "pipeline")
          import eaip
          d = json.load(open("/tmp/eaip-out/eaip.json"))
          print("cycle", d["cycle"])
          for k, a in d["airports"].items():
              print(k, "TA", a.get("ta_ft"), "magvar", a.get("magvar"), "ARP", a.get("arp"))
              for q, r in a["rwys"].items():
                  print("  ", q, {x: r.get(x) for x in ("true", "mag", "len", "tora", "lda", "papi", "ils")})
          # Structure brute de sections encore mal lues (diagnostic)
          for icao, sec, n in (("LFML", 17, 12), ("LFLL", 12, 3), ("LFMN", 12, 3)):
              h = open(f"/tmp/eaip-raw/FR-AD-2.{icao}-fr-FR.html", encoding="utf-8").read()
              for row in eaip.rows(eaip.sections(h, icao).get(sec, ""))[:n]:
                  print(f"{icao} AD2.{sec}", row)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: "Front (Vue + TypeScript) : typage et build"
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/data/ground.pmtiles
          node --check scripts/screenshots.mjs
